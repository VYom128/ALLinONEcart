name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # mongodb-memory-server downloads a MongoDB binary on first use (pinned in server/package.json).
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package.json') }}

      - run: npm ci
      - run: npm run build:shared
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Start MongoDB (replica set) and Redis
        run: docker compose up -d --wait mongo redis

      - name: Create server/.env
        run: cp server/.env.example server/.env

      - run: npm run seed
      - run: npm run smoke

      - name: Service logs on failure
        if: failure()
        run: docker compose logs mongo redis

      - name: Stop services
        if: always()
        run: docker compose down -v
